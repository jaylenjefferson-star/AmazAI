<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AmazAI</title>
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Build a team of AI companions that research, create, use your tools, run recurring work, and collaborate with you from one workspace." />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AmazAI" />
    <meta property="og:title" content="AmazAI" />
    <meta property="og:description" content="Build a team of AI companions that research, create, use your tools, run recurring work, and collaborate with you from one workspace." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Before first paint, so no route flashes the wrong theme. The signed-in app
      // is light unless its owner chose otherwise (its premium look is the light
      // editorial one); the public site is likewise light unless they chose dark
      // or system. Keep in step with modeForPath in src/theme.js.
      try {
        var pub = /^\/(welcome-to-amazai|about|how-it-works|product|pricing|integrations|use-cases|security|for-teams|enterprise|faq|contact|legal|terms|privacy|cookie-policy|acceptable-use|security-disclosure|security-responsible-disclosure)(\/|$)/;
        var m = localStorage.getItem('amazai.theme');
        var chosen = (m === 'light' || m === 'dark' || m === 'system') ? m : null;
        var signedIn = false;
        for (var i = 0; i < localStorage.length; i++) {
          if ((localStorage.key(i) || '').indexOf('@@auth0spajs@@') === 0) { signedIn = true; break; }
        }
        if (/[?&]demo=1/.test(location.search)) signedIn = true;
        var mode = (pub.test(location.pathname) || !signedIn)
          ? ((chosen === 'dark' || chosen === 'system') ? chosen : 'light')
          : (chosen || 'light');
        if (mode !== 'system') document.documentElement.setAttribute('data-theme', mode);
      } catch (e) {
        // A signed-out/unknown visitor should land on the light canvas, not a
        // flash of dark, matching the default above.
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
