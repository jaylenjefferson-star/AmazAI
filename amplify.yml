# Amplify Hosting build spec.
#
# The console is a Vite SPA under web/, so appRoot points there and every
# path below is relative to it. `npm ci` rather than `npm install`: the build
# should fail on a stale lockfile instead of quietly resolving something the
# local machine never saw.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
            # Merge the SPA 200 rewrite onto this Amplify app so /welcome and
            # /agents/:id hard-loads are index.html with status 200, not
            # 301→404. Static copies from the build already cover /welcome/
            # if this call cannot auth. A permission miss must not fail deploy.
            - node scripts/apply-amplify-spa-rewrite.mjs --apply || echo "Amplify SPA rewrite was not applied; dist/welcome/index.html still ships"
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
